    <text x="954" y="156" fill="#d7d7de" font-size="14" text-anchor="end" font-weight="normal">100.0%</text>
    <rect x="18" y="166" width="936" height="1" fill="#272733" />
    <text x="18" y="184" fill="#d7d7de" font-size="15" text-anchor="start" font-weight="normal">Used in recorded shaders</text>
    <text x="400" y="184" fill="#d7d7de" font-size="14" text-anchor="start" font-weight="normal">run on AMD and NVIDIA</text>
    <rect x="610" y="174" width="125" height="6" fill="#272733" />
    <rect x="610" y="174" width="125.0" height="6" fill="#6fc7d4" />
    <text x="870" y="184" fill="#d7d7de" font-size="14" text-anchor="end" font-weight="normal">372/372</text>
    <text x="954" y="184" fill="#d7d7de" font-size="14" text-anchor="end" font-weight="normal">100.0%</text>
    <text x="18" y="218" fill="#a0a0b1" font-size="13" text-anchor="start" font-weight="normal">Compiled alone through DXC and DXV, or run by a GPU check. Compiling doesn't prove a result matches the console.</text>
  </g>
