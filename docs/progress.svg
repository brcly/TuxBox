<svg xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Terminess Nerd Font Mono', 'DejaVu Sans Mono', Consolas, monospace" aria-labelledby="map-title map-description" viewBox="0 0 1000 880" width="1000" height="880">
  <title id="map-title">TuxBox runtime compatibility</title>
  <desc id="map-description">Overall coverage gives equal weight to verified library behaviors and RDNA 2 instructions converted to HLSL that compiles to DXIL.</desc>
  <rect x="0" y="0" width="1000" height="880" fill="#0b0b0f" />
  <rect x="0" y="0" width="1000" height="48" fill="#090910" />
  <rect x="0" y="47" width="1000" height="1" fill="#272733" />
  <rect x="14" y="10" width="210" height="27" fill="#e2bc8c" />
  <text x="119" y="29" fill="#0b0b0f" font-size="15" text-anchor="middle" font-weight="bold">Runtime compatibility</text>
  <text x="500" y="32" fill="#e2bc8c" font-size="22" text-anchor="middle" font-weight="bold" letter-spacing="4">TUXBOX</text>
  <text x="986" y="30" fill="#6fc7d4" font-size="16" text-anchor="end" font-weight="normal">Xbox Series X|S</text>
  <g transform="translate(14 60)">
    <title>Overall TuxBox coverage</title>
    <rect x="0" y="0" width="972" height="112" fill="#14141d" stroke="#e2bc8c" />
    <text x="18" y="32" fill="#e2bc8c" font-size="25" text-anchor="start" font-weight="bold">Overall TuxBox coverage</text>
    <text x="954" y="32" fill="#6fc7d4" font-size="23" text-anchor="end" font-weight="bold">76.4%</text>
    <rect x="18" y="45" width="936" height="8" fill="#272733" />
    <rect x="18" y="45" width="714.916129032258" height="8" fill="#6fc7d4" />
    <text x="18" y="77" fill="#d7d7de" font-size="15" text-anchor="start" font-weight="normal">Library behaviors · 8/9 verified (88.9%)</text>
    <text x="954" y="77" fill="#d7d7de" font-size="15" text-anchor="end" font-weight="normal">RDNA 2 instructions · 693/1,085 (63.9%)</text>
    <text x="18" y="99" fill="#a0a0b1" font-size="13" text-anchor="start" font-weight="normal">50% required library behaviors, 50% RDNA 2 instructions converted to DXIL.</text>
  </g>
  <g transform="translate(14 184)">
