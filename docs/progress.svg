    <text x="954" y="128" fill="#d7d7de" font-size="14" text-anchor="end" font-weight="normal">63.9%</text>
    <rect x="18" y="138" width="936" height="1" fill="#272733" />
    <text x="18" y="156" fill="#d7d7de" font-size="15" text-anchor="start" font-weight="normal">Used in recorded shaders</text>
