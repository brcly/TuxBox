    <text x="18" y="70" fill="#e2bc8c" font-size="25" text-anchor="start" font-weight="bold">RDNA 2 instructions</text>
    <text x="18" y="96" fill="#d7d7de" font-size="15" text-anchor="start" font-weight="normal">Converted to HLSL that compiles to DXIL</text>
